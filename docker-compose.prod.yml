# Overlay pra staging/produção — combine com o docker-compose.yml base:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (scripts/deploy.sh já faz isso por você — ver ali antes de rodar isto na mão)
#
# O docker-compose.yml base só tem o Postgres (também usado no dev local sem
# Docker, via scripts/env-up.sh) — este overlay ADICIONA a API, o serviço de
# OTP por WhatsApp e os 3 frontends como containers supervisionados
# (restart: unless-stopped), sem tocar no que já existia.
version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bigods-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  whatsapp-otp:
    build:
      context: services/whatsapp-otp
    container_name: bigods-whatsapp-otp
    restart: unless-stopped
    env_file: .env
    volumes:
      - whatsapp_session:/app/session
    ports:
      - "3100:3100"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_BOOKING_URL: ${VITE_BOOKING_URL:-}
    container_name: bigods-admin
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

  booking:
    build:
      context: .
      dockerfile: apps/booking/Dockerfile
      args:
        VITE_COMPANY_ID: ${VITE_COMPANY_ID:-bigods}
    container_name: bigods-booking
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
    ports:
      - "5174:5174"
    depends_on:
      - api

  account:
    build:
      context: .
      dockerfile: apps/account/Dockerfile
      args:
        VITE_COMPANY_ID: ${VITE_COMPANY_ID:-bigods}
        VITE_BOOKING_URL: ${VITE_BOOKING_URL:-}
    container_name: bigods-account
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
    ports:
      - "5175:5175"
    depends_on:
      - api

volumes:
  whatsapp_session:
